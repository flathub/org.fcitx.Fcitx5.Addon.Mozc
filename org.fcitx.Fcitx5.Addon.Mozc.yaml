app-id: org.fcitx.Fcitx5.Addon.Mozc
runtime: org.fcitx.Fcitx5
runtime-version: stable
sdk: org.kde.Sdk//6.11
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
build-extension: true
separate-locales: false
build-options:
  prefix: /app/addons/Mozc
  prepend-path: /usr/lib/sdk/llvm21/bin:/app/addons/Mozc/bin
  prepend-pkg-config-path: /app/addons/Mozc/lib/pkgconfig
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
  env:
    - server_dir=/app/addons/Mozc/lib/mozc
    - document_dir=/app/ime/mozc/licenses/mozc
    - icons_dir=/app/share/icons/mozc
    - LOCALE=C.UTF-8
    - CC=clang
    - CXX=clang++
cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - '*.la'
modules:
  - name: bazel
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/bazelbuild/bazel/releases/download/9.0.2/bazel-9.0.2-linux-x86_64
        sha256: 422e7a1690b76d7e615c29091d3aca28d0bd3a93fe3c93cbefb8f72d774926d5
        dest-filename: bazel
        x-checker-data:
          type: anitya
          project-id: 15227
          stable-only: true
          url-template: https://github.com/bazelbuild/bazel/releases/download/${version}/bazel-${version}-linux-x86_64
          versions:
            <=: 9.0.2
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/bazelbuild/bazel/releases/download/9.0.2/bazel-9.0.2-linux-arm64
        sha256: e9fc2c7b0027619058acae81c063e5ced683cb0f1598e9373b4f752820c03adb
        dest-filename: bazel
        x-checker-data:
          type: anitya
          project-id: 15227
          stable-only: true
          url-template: https://github.com/bazelbuild/bazel/releases/download/${version}/bazel-${version}-linux-arm64
          versions:
            <=: 9.0.2
    build-commands:
      - install -D -m755 bazel ${FLATPAK_DEST}/bin/bazel
    cleanup:
      - '*'
  - name: mozc
    buildsystem: simple
    subdir: src
    build-options:
      no-debuginfo: true
      strip: true
    build-commands:
      - ../scripts/build_fcitx5_bazel --config release_build --distdir=$PWD/../bazel-deps
        --registry=file:///$PWD/../bcr $(echo "${LDFLAGS}"|xargs -n1 echo "--linkopt")
        && PREFIX=${FLATPAK_DEST} ../scripts/install_server_bazel && PREFIX=${FLATPAK_DEST}
        ../scripts/install_fcitx5_bazel
    sources:
      - type: git
        url: https://github.com/fcitx/mozc
        disable-shallow-clone: true
        commit: 6b20c794f3112075703bae1603a81dce86b1f44e
      - type: git
        url: https://github.com/bazelbuild/bazel-central-registry
        dest: bcr
        commit: d31607c38086db2b150846aa25c1a4c0dd28c036
      - mozc-deps.yaml
      - type: shell
        commands:
          - sed -e "s|LINUX_MOZC_DOCUMENT_DIR = \(.*\)|LINUX_MOZC_DOCUMENT_DIR = \"${document_dir}\"|"
            -e "s|LINUX_MOZC_SERVER_DIR = \(.*\)|LINUX_MOZC_SERVER_DIR = \"${server_dir}\"|"
            -e "s|LINUX_MOZC_ICONS_DIR = \(.*\)|LINUX_MOZC_ICONS_DIR = \"${icons_dir}\"|"
            -i src/config.bzl
          - SHA256_ZIP_CODE_KEN_ALL=$(sha256sum bazel-deps/ken_all.zip | cut -d' '
            -f1); SHA256_ZIP_CODE_JIGYOSYO=$(sha256sum bazel-deps/jigyosyo.zip | cut
            -d' ' -f1); sed -e "s|SHA256_ZIP_CODE_KEN_ALL = \(.*\)|SHA256_ZIP_CODE_KEN_ALL
            = \"${SHA256_ZIP_CODE_KEN_ALL}\"|" -e "s|SHA256_ZIP_CODE_JIGYOSYO = \(.*\)|SHA256_ZIP_CODE_JIGYOSYO
            = \"${SHA256_ZIP_CODE_JIGYOSYO}\"|" -i src/config.bzl src/MODULE.bazel
